- entity_type: Component
  id: COMPONENT:MASTER-PROCESS
  name: Master process
  url: https://nginx.org/en/docs/dev/development_guide.html
  locator: Processes
  definition: Tiến trình điều phối cấu hình và vòng đời các worker.
  normal_behavior: Master đọc cấu hình, quản lý worker và phản ứng với tín hiệu; graceful
    reload tạo worker mới rồi cho worker cũ kết thúc các request đang xử lý.
  architecture_position: Ranh giới giữa quyền quản trị cấu hình và xử lý lưu lượng
    trong worker.
  security_boundary: Ranh giới giữa quyền quản trị cấu hình và xử lý lưu lượng trong
    worker.
  safety_assumptions: Cấu hình và tệp thực thi phải do chủ thể tin cậy quản lý.
  related_failure_classes: Sai phân quyền; cấu hình không nhất quán.
  failure_impact: Dịch vụ không khởi động hoặc thực thi cấu hình ngoài dự kiến.
  defensive_principles: Kiểm tra cấu hình trước reload, giới hạn quyền sửa cấu hình
    và theo dõi lỗi reload.
  related_knowledge: []
  diagram: 'flowchart TD

    C[Trusted configuration] --> M[Master process]

    M --> W1[Worker 1]

    M --> W2[Worker 2]

    W1 --> E1[Event loop]

    W2 --> E2[Event loop]'
- entity_type: Component
  id: COMPONENT:WORKER-PROCESS
  name: Worker process
  url: https://nginx.org/en/docs/dev/development_guide.html
  locator: Processes
  definition: Tiến trình xử lý các kết nối bằng cơ chế hướng sự kiện.
  normal_behavior: Worker nhận sự kiện mạng, chạy handler và duy trì trạng thái của
    nhiều kết nối; các worker là các process riêng.
  architecture_position: Dữ liệu từ kết nối đi vào không gian địa chỉ của worker.
  security_boundary: Dữ liệu từ kết nối đi vào không gian địa chỉ của worker.
  safety_assumptions: Module không được làm hỏng bộ nhớ hoặc chặn event loop quá lâu.
  related_failure_classes: Memory safety; resource exhaustion.
  failure_impact: Worker kết thúc bất thường hoặc giảm khả năng phục vụ các kết nối
    cùng worker.
  defensive_principles: Theo dõi worker restart, áp dụng bản vá và giới hạn nguồn
    lực theo workload.
  related_knowledge: []
  diagram: ''
- entity_type: Component
  id: COMPONENT:EVENT-DRIVEN
  name: Event-driven architecture
  url: https://nginx.org/en/docs/dev/development_guide.html
  locator: Events
  definition: Mô hình xử lý công việc khi có sự kiện thay vì dành một thread cho mỗi
    kết nối.
  normal_behavior: Readiness của socket, timer và posted event kích hoạt callback;
    callback cập nhật trạng thái rồi trả điều khiển.
  architecture_position: Event handler và trạng thái kết nối thuộc cùng vòng đời xử
    lý.
  security_boundary: Event handler và trạng thái kết nối thuộc cùng vòng đời xử lý.
  safety_assumptions: Callback phải xử lý trường hợp dữ liệu chưa hoàn chỉnh và không
    giữ tham chiếu quá vòng đời.
  related_failure_classes: Use-after-free; state-machine inconsistency.
  failure_impact: Hỏng trạng thái hoặc trì hoãn hàng loạt kết nối.
  defensive_principles: Quản lý vòng đời rõ ràng, kiểm tra trạng thái và giữ callback
    có thời gian thực thi hữu hạn.
  related_knowledge: []
  diagram: ''
- entity_type: Component
  id: COMPONENT:EVENT-LOOP
  name: Event loop
  url: https://nginx.org/en/docs/dev/development_guide.html
  locator: Event loop
  definition: Vòng lặp điều phối I/O event, timer và posted event.
  normal_behavior: Vòng lặp gọi backend sự kiện của hệ điều hành, xử lý các callback
    sẵn sàng và chạy timer đến hạn.
  architecture_position: Mọi request trong worker chia sẻ ngân sách thời gian xử lý.
  security_boundary: Mọi request trong worker chia sẻ ngân sách thời gian xử lý.
  safety_assumptions: Handler không được chạy vòng lặp vô hạn hoặc gọi thư viện blocking
    không kiểm soát.
  related_failure_classes: Infinite loop; excessive CPU usage.
  failure_impact: Suy giảm availability của worker.
  defensive_principles: Tách công việc blocking qua cơ chế được hỗ trợ và kiểm soát
    timeout/giới hạn công việc.
  related_knowledge: []
  diagram: ''
- entity_type: Component
  id: COMPONENT:NONBLOCKING-IO
  name: Non-blocking I/O
  url: https://nginx.org/en/docs/dev/development_guide.html
  locator: I/O events
  definition: Thao tác I/O trả về ngay khi chưa thể hoàn tất.
  normal_behavior: Handler đọc/ghi một phần dữ liệu, lưu offset và đăng ký chờ sự
    kiện tiếp theo khi socket chưa sẵn sàng.
  architecture_position: Ranh giới giữa byte stream từ hệ điều hành và trạng thái
    ứng dụng.
  security_boundary: Ranh giới giữa byte stream từ hệ điều hành và trạng thái ứng
    dụng.
  safety_assumptions: Không được coi một lần đọc là một thông điệp hoàn chỉnh.
  related_failure_classes: Truncated parsing; buffer-boundary errors.
  failure_impact: Xử lý sai thông điệp hoặc truy cập ngoài vùng nhớ.
  defensive_principles: Theo dõi số byte đã xử lý, kiểm tra kết quả hệ thống và giữ
    parser theo trạng thái.
  related_knowledge: []
  diagram: ''
- entity_type: Component
  id: COMPONENT:MEMORY-POOL
  name: Memory pool
  url: https://nginx.org/en/docs/dev/development_guide.html
  locator: Pool
  definition: Bộ cấp phát nhóm các allocation có vòng đời gần nhau.
  normal_behavior: NGINX sử dụng pool để cấp phát nhiều đối tượng nhỏ và giải phóng
    theo vòng đời pool; cleanup handler xử lý tài nguyên liên quan.
  architecture_position: Con trỏ không được tiếp tục dùng sau khi pool chứa nó đã
    bị hủy.
  security_boundary: Con trỏ không được tiếp tục dùng sau khi pool chứa nó đã bị hủy.
  safety_assumptions: Vòng đời request, connection và callback phải tương thích với
    vòng đời pool.
  related_failure_classes: Use-after-free; double free; memory leak.
  failure_impact: Worker crash hoặc hỏng bộ nhớ tùy lỗi cụ thể.
  defensive_principles: Ghi rõ ownership, kiểm tra callback trễ và dùng công cụ phát
    hiện lỗi bộ nhớ trong kiểm thử phát triển.
  related_knowledge: []
  diagram: ''
- entity_type: Component
  id: COMPONENT:CONNECTION-LIFECYCLE
  name: Connection lifecycle
  url: https://nginx.org/en/docs/dev/development_guide.html
  locator: Connection
  definition: Chuỗi trạng thái từ tiếp nhận đến giải phóng kết nối.
  normal_behavior: Cấu trúc connection lưu socket và event đọc/ghi; close phải phối
    hợp giải phóng socket, pool và các tham chiếu còn tồn tại.
  architecture_position: Ranh giới giữa socket, timer, request và bộ nhớ lưu trạng
    thái.
  security_boundary: Ranh giới giữa socket, timer, request và bộ nhớ lưu trạng thái.
  safety_assumptions: Mỗi tài nguyên có một chủ sở hữu và thao tác hoàn tất nhất quán.
  related_failure_classes: Use-after-free; NULL dereference; leak.
  failure_impact: Mất kết nối hoặc lỗi worker.
  defensive_principles: Hủy timer/posted event đúng lúc và kiểm tra trạng thái trước
    khi xử lý callback.
  related_knowledge: []
  diagram: ''
- entity_type: Component
  id: COMPONENT:PROCESS-PRIVILEGES
  name: Process privileges
  url: https://nginx.org/en/docs/dev/development_guide.html
  locator: Processes
  definition: Tách quyền của tiến trình điều phối và tiến trình xử lý request.
  normal_behavior: Master có thể cần quyền tạo tài nguyên; worker sử dụng user/group
    cấu hình. Quyền thực tế phụ thuộc cách vận hành dịch vụ.
  architecture_position: Ranh giới hệ điều hành giữa quyền quản trị, tệp hệ thống
    và dữ liệu request.
  security_boundary: Ranh giới hệ điều hành giữa quyền quản trị, tệp hệ thống và dữ
    liệu request.
  safety_assumptions: Không suy ra worker chạy root chỉ từ việc master có quyền cao.
  related_failure_classes: Privilege misconfiguration.
  failure_impact: Phạm vi tác động có thể lớn hơn khi quyền worker vượt nhu cầu.
  defensive_principles: Áp dụng least privilege và đối chiếu service unit, user directive
    cùng quyền tệp.
  related_knowledge: []
  diagram: ''
- entity_type: Component
  id: COMPONENT:HTTP-REQUEST-LIFECYCLE
  name: HTTP request lifecycle
  url: https://nginx.org/en/docs/dev/development_guide.html
  locator: HTTP
  definition: Vòng đời parse, chọn cấu hình, xử lý phase và hoàn tất response.
  normal_behavior: Request đi qua các phase như rewrite/access/content; output filter
    xử lý header/body trước khi gửi. Finalization điều phối tài nguyên và subrequest.
  architecture_position: Chuyển từ dữ liệu chưa tin cậy sang cấu hình, handler và
    response.
  security_boundary: Chuyển từ dữ liệu chưa tin cậy sang cấu hình, handler và response.
  safety_assumptions: Trạng thái request và số tham chiếu phải nhất quán qua redirect/subrequest.
  related_failure_classes: Parsing inconsistency; use-after-free.
  failure_impact: Định tuyến hoặc xử lý response sai.
  defensive_principles: Review thứ tự phase, giới hạn request và bảo đảm cleanup đúng
    vòng đời.
  related_knowledge: []
  diagram: 'flowchart LR

    A[Connection] --> B[Parse request]

    B --> C[Select server and location]

    C --> D[Rewrite and access phases]

    D --> E[Content handler]

    E --> F[Output filters]

    F --> G[Finalize request]'
- entity_type: Component
  id: COMPONENT:REQUEST-PARSING
  name: Request parsing
  url: https://nginx.org/en/docs/dev/development_guide.html
  locator: HTTP
  definition: Biến byte trên kết nối thành cấu trúc request có ý nghĩa.
  normal_behavior: Parser phân biệt request line, header và body framing theo giao
    thức, tiếp tục khi dữ liệu đến thành nhiều phần.
  architecture_position: Ranh giới byte stream và thông điệp HTTP.
  security_boundary: Ranh giới byte stream và thông điệp HTTP.
  safety_assumptions: Các thành phần proxy phải hiểu thống nhất chiều dài và ranh
    giới thông điệp.
  related_failure_classes: Request parsing inconsistencies; integer overflow.
  failure_impact: Routing hoặc phân tách request sai giữa các thành phần.
  defensive_principles: Dùng parser tiêu chuẩn, loại thông điệp mơ hồ và cập nhật
    toàn bộ chuỗi proxy.
  related_knowledge: []
  diagram: ''
- entity_type: Component
  id: COMPONENT:VIRTUAL-HOSTS
  name: Virtual hosts
  url: https://nginx.org/en/docs/http/request_processing.html
  locator: Name-based virtual servers
  definition: Nhiều cấu hình server chia sẻ hạ tầng lắng nghe.
  normal_behavior: NGINX chọn nhóm listen theo địa chỉ/cổng và đối chiếu tên server;
    default server thuộc socket listen. TLS có bước chọn theo SNI.
  architecture_position: Ranh giới chính sách giữa các tên miền dùng chung listener.
  security_boundary: Ranh giới chính sách giữa các tên miền dùng chung listener.
  safety_assumptions: Các quyết định xác thực và cấu hình phải gắn đúng server được
    chọn.
  related_failure_classes: Authentication policy violation.
  failure_impact: Áp dụng nhầm chính sách truy cập giữa virtual hosts.
  defensive_principles: Rà soát default server, server_name và chính sách TLS/mTLS
    nhất quán.
  related_knowledge: []
  diagram: ''
- entity_type: Component
  id: COMPONENT:LOCATION-MATCHING
  name: Location matching
  url: https://nginx.org/en/docs/http/ngx_http_core_module.html
  locator: location
  definition: Chọn cấu hình xử lý theo URI.
  normal_behavior: NGINX xử lý location có exact match, prefix và regular expression
    theo quy tắc của core module; internal redirect có thể chọn lại location.
  architecture_position: Ranh giới URI, đường dẫn tài nguyên và cấu hình kiểm soát
    truy cập.
  security_boundary: Ranh giới URI, đường dẫn tài nguyên và cấu hình kiểm soát truy
    cập.
  safety_assumptions: Không giả định thứ tự dòng trong tệp luôn là thứ tự ưu tiên
    match.
  related_failure_classes: Configuration policy bypass; path mapping error.
  failure_impact: Request đi vào handler hoặc tài nguyên ngoài dự kiến.
  defensive_principles: Kiểm thử các trường hợp URI đại diện và kiểm tra sự tương
    tác giữa location, alias và rewrite.
  related_knowledge: []
  diagram: ''
- entity_type: Component
  id: COMPONENT:REWRITE-ENGINE
  name: Rewrite engine
  url: https://nginx.org/en/docs/http/ngx_http_rewrite_module.html
  locator: ngx_http_rewrite_module
  definition: Bộ xử lý directive sửa URI hoặc trả response dựa trên cấu hình.
  normal_behavior: Các directive rewrite được biên dịch thành lệnh nội bộ khi nạp
    cấu hình; xử lý request có thể thay URI và kích hoạt chọn lại location theo cờ.
  architecture_position: Ranh giới giữa giá trị động của request và cấu hình điều
    khiển.
  security_boundary: Ranh giới giữa giá trị động của request và cấu hình điều khiển.
  safety_assumptions: Độ dài chuỗi, biến và trạng thái redirect phải được quản lý
    nhất quán.
  related_failure_classes: Buffer overflow; excessive rewrite iterations.
  failure_impact: Hỏng bộ nhớ hoặc xử lý URI sai.
  defensive_principles: Giữ cấu hình dễ kiểm tra, tránh chu kỳ và dùng bản đã sửa
    theo advisory liên quan.
  related_knowledge: []
  diagram: ''
- entity_type: Component
  id: COMPONENT:REVERSE-PROXY
  name: Reverse proxy
  url: https://nginx.org/en/docs/http/ngx_http_proxy_module.html
  locator: proxy_pass
  definition: Thành phần nhận request client và chuyển tới upstream rồi trả response.
  normal_behavior: Proxy module tạo request upstream, xử lý kết nối, header và buffering
    theo cấu hình; upstream là một trust boundary riêng.
  architecture_position: Ranh giới client ↔ NGINX ↔ backend.
  security_boundary: Ranh giới client ↔ NGINX ↔ backend.
  safety_assumptions: Không tin header định danh hay thông tin tuyến do client cung
    cấp nếu chưa kiểm soát.
  related_failure_classes: Parsing inconsistencies; information disclosure.
  failure_impact: Sai định tuyến hoặc lộ dữ liệu theo cách ứng dụng dùng proxy.
  defensive_principles: Xác định rõ header tin cậy, timeout, TLS upstream và kích
    thước buffer.
  related_knowledge: []
  diagram: ''
- entity_type: Component
  id: COMPONENT:UPSTREAM-COMMUNICATION
  name: Upstream communication
  url: https://nginx.org/en/docs/dev/development_guide.html
  locator: Load balancing
  definition: Quản lý peer, kết nối và trao đổi với dịch vụ backend.
  normal_behavior: Upstream lựa chọn peer theo cấu hình; quá trình connect/send/read
    phải xử lý lỗi và timeout. Retry phải phù hợp với semantics request.
  architecture_position: Ranh giới mạng giữa proxy và backend.
  security_boundary: Ranh giới mạng giữa proxy và backend.
  safety_assumptions: Không coi mọi request có thể retry an toàn.
  related_failure_classes: State confusion; improper certificate validation.
  failure_impact: Kết quả request trùng lặp hoặc truyền dữ liệu sai backend.
  defensive_principles: Rà soát retry, giới hạn kết nối và xác minh chứng chỉ upstream
    theo yêu cầu triển khai.
  related_knowledge: []
  diagram: ''
- entity_type: Component
  id: COMPONENT:RESPONSE-BUFFERING
  name: Response buffering
  url: https://nginx.org/en/docs/http/ngx_http_proxy_module.html
  locator: proxy_buffering
  definition: Lưu tạm response upstream trong memory buffer hoặc tệp tạm.
  normal_behavior: Khi bật buffering, NGINX đọc response upstream vào buffer cấu hình;
    dữ liệu vượt ngưỡng có thể được ghi ra tệp tạm.
  architecture_position: Ranh giới buffer, bộ nhớ worker và filesystem tạm.
  security_boundary: Ranh giới buffer, bộ nhớ worker và filesystem tạm.
  safety_assumptions: Kích thước và vòng đời buffer phải đúng, quyền thư mục tạm phải
    phù hợp.
  related_failure_classes: Out-of-bounds access; resource exhaustion.
  failure_impact: Tăng RAM/disk hoặc lỗi worker tùy nguyên nhân.
  defensive_principles: Giới hạn buffer/tệp tạm, theo dõi dung lượng và cập nhật module
    liên quan.
  related_knowledge: []
  diagram: ''
- entity_type: Component
  id: COMPONENT:HTTP-CACHING
  name: HTTP caching
  url: https://nginx.org/en/docs/http/ngx_http_proxy_module.html
  locator: proxy_cache
  definition: Tái sử dụng response upstream theo cache key và chính sách cache.
  normal_behavior: NGINX tra cache theo key, thời gian hiệu lực và chỉ thị cache;
    các điều kiện bypass/no-cache quyết định việc đọc hoặc lưu response.
  architecture_position: Ranh giới dữ liệu dùng chung trong cache và dữ liệu gắn người
    dùng/tenant.
  security_boundary: Ranh giới dữ liệu dùng chung trong cache và dữ liệu gắn người
    dùng/tenant.
  safety_assumptions: Cache key phải phân biệt các context trả về nội dung khác nhau.
  related_failure_classes: Information disclosure; cache key inconsistency.
  failure_impact: Nội dung bị chia sẻ sai phạm vi hoặc lỗi thời.
  defensive_principles: Rà soát cache key, Authorization/Cookie, Vary và điều kiện
    bypass cho dữ liệu riêng tư.
  related_knowledge: []
  diagram: ''
- entity_type: Protocol
  id: PROTOCOL:TCP
  name: TCP
  url: https://www.rfc-editor.org/rfc/rfc9293.html
  locator: Protocol overview and state machine
  definition: Transport byte stream tin cậy, có thứ tự.
  normal_behavior: Sequence number, acknowledgement và cơ chế truyền lại duy trì byte
    stream; ứng dụng vẫn phải tự phân định thông điệp.
  architecture_position: Stream bytes ↔ parser ứng dụng.
  security_boundary: Stream bytes ↔ parser ứng dụng.
  safety_assumptions: Không đồng nhất segment TCP với thông điệp ứng dụng.
  related_failure_classes: Parsing inconsistencies; state confusion; resource exhaustion.
  failure_impact: Sai xử lý thông điệp hoặc suy giảm availability; tác động cụ thể
    cần advisory tương ứng.
  defensive_principles: Áp dụng bản vá implementation, giới hạn tài nguyên và kiểm
    tra cấu hình giao thức theo tài liệu nhà cung cấp.
  related_knowledge: []
  diagram: ''
- entity_type: Protocol
  id: PROTOCOL:UDP
  name: UDP
  url: https://www.rfc-editor.org/rfc/rfc768.html
  locator: Protocol overview and state machine
  definition: Transport datagram không bảo đảm giao hàng hay thứ tự.
  normal_behavior: Mỗi datagram có chiều dài riêng; ứng dụng xử lý mất gói, trùng
    lặp và thứ tự khi cần.
  architecture_position: Datagram mạng ↔ trạng thái ứng dụng.
  security_boundary: Datagram mạng ↔ trạng thái ứng dụng.
  safety_assumptions: Địa chỉ nguồn và datagram chưa mặc nhiên được xác thực.
