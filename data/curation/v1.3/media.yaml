group: media
name: Media processing — metadata, kích thước và ownership
knowledge:
  - id: MODULE:NGX-HTTP-MP4-MODULE
    name: MP4 pseudo-streaming và ranh giới metadata
    source: https://nginx.org/en/docs/http/ngx_http_mp4_module.html
    locator: Introduction; #mp4; #mp4_buffer_size; #mp4_max_buffer_size
    excerpt: provides pseudo-streaming
    source_fact: Module MP4 thực hiện pseudo-streaming; việc xử lý metadata có chi phí CPU, bộ nhớ và I/O. Tài liệu phân biệt xử lý media với gửi file tĩnh và quy định giới hạn buffer metadata.
    prerequisites: [COMPONENT:MEMORY-POOL, COMPONENT:CONNECTION-LIFECYCLE]
    objectives:
      - Phân biệt gửi file MP4 tĩnh với việc phân tích và tái sắp metadata.
      - Giải thích vì sao kích thước buffer và tính hợp lệ của index là hai nghĩa vụ riêng.
    body: |
      ## Cơ chế bình thường và ownership

      Module không phải bộ giải mã video tổng quát. Nó đọc cấu trúc mô tả media để tạo một đoạn có thời gian bắt đầu/kết thúc phù hợp với trình phát. Metadata moov chứa thông tin index. Khi metadata nằm cuối file, server phải chuẩn bị thứ tự đầu ra thích hợp trước khi phát dữ liệu; việc chuẩn bị file ngay ở bước xuất bản có thể giảm công việc lặp tại worker. Request không có yêu cầu xử lý đoạn có thể đi theo đường gửi tài nguyên tĩnh được tài liệu mô tả.

      Tách ba loại tài nguyên khi thiết kế: file nguồn do hệ thống lưu trữ quản lý, buffer metadata phục vụ xử lý, và các buffer đầu ra có thể chưa gửi hết. Việc đã đọc xong metadata không có nghĩa output đã hoàn thành. Đây là mô hình ownership để review, không xác nhận chính xác cấu trúc C của từng bản NGINX. Khi request kết thúc hoặc bị hủy, không được còn callback dùng bộ nhớ thuộc request đã giải phóng.

      ## Invariant về cấu trúc và kích thước

      Diễn giải phòng vệ: offset phải nằm trong vùng file tương ứng, số phần tử phải phù hợp độ dài bảng, và phép nhân/cộng để tính kích thước phải biểu diễn được trong kiểu đích trước cấp phát. Kiểm giới hạn một buffer không thay thế kiểm quan hệ giữa các bảng. Máy 32-bit có miền biểu diễn khác 64-bit; điều này giúp hiểu vì sao applicability có thể giới hạn kiến trúc, nhưng không tự chứng minh CVE nào là integer overflow.

      ## Tradeoff và kiểm soát

      Giới hạn metadata tránh một request chiếm bộ nhớ không giới hạn; tăng giới hạn để nhận file lớn cũng tăng ngân sách tài nguyên cần dự phòng. Tài liệu cho biết vượt mp4_max_buffer_size dẫn đến lỗi xử lý; đó không phải bằng chứng rằng mọi lỗi parser đều được chặn. Chuẩn hóa media trong quy trình xuất bản và hạn chế ai được đưa file vào vùng phục vụ giúp quản trị đầu vào, còn bản vá vẫn cần thiết cho lỗi implementation.

      ## Liên hệ nghiên cứu

      CVE-2024-7347 mô tả over-read và kết thúc worker; CVE-2026-27784 giới hạn 32-bit; CVE-2026-32647 có khả năng thực thi mã được CNA nêu như tác động có thể xảy ra. Đọc từng note để lấy evidence và giới hạn; cùng module không có nghĩa cùng lỗi hay cùng hậu quả. Không sử dụng tên CWE để suy vị trí atom hoặc hàm lỗi.
    assessment: Tại sao một file phát được bằng trình phát không đủ chứng minh đường xử lý metadata trên server an toàn? Vì sao không chuyển điều kiện 32-bit của 27784 sang 32647?
    answer: Hai phần mềm có parser, phép tính và lifecycle riêng. Điều kiện kiến trúc là dữ kiện của từng advisory; chỉ nguồn của đúng CVE mới hỗ trợ việc thu hẹp phạm vi đó.
articles:
  - cve: CVE-2024-7347
    summary: Over-read trong module MP4 có thể làm worker kết thúc khi xử lý media. Việc chỉ phục vụ tệp có đuôi MP4 không đủ xác định applicability; CNA yêu cầu module được build, directive mp4 được sử dụng và tệp được đưa qua đường xử lý đó.
    architecture: ngx_http_mp4_module trong worker xử lý HTTP; chưa xác định atom, hàm hoặc allocation chịu lỗi từ các nguồn đã đọc.
    normal: Worker đọc metadata phục vụ pseudo-streaming và tạo nội dung đầu ra theo request. Buffer metadata phải chứa đủ dữ liệu cho mọi phép đọc; vòng đời buffer phải bao trùm việc sử dụng nó.
    mechanism: Nguồn mô tả đọc vượt vùng bộ nhớ khi phân tích MP4. Về nguyên lý, kích thước được chấp nhận và miền byte thực sự được đọc phải nhất quán; đây là invariant diễn giải, chưa phải kết luận về dòng kiểm tra bị thiếu.
    applicability: NGINX Open Source có ngx_http_mp4_module và cấu hình dùng mp4; nội dung phải được xử lý qua module. CNA cũng nói đến Plus, nhưng dải phiên bản ở bài này chỉ dành cho OSS.
    impact: CNA xác nhận khả năng over-read bộ nhớ worker và làm worker kết thúc. Không có xác nhận rằng bộ nhớ đó được gửi ra client.
    potential: Khả năng tiết lộ dữ liệu hoặc thực thi mã cho riêng CVE này là UNKNOWN trong nguồn đã đọc; over-read không tự chứng minh hai hậu quả đó.
    principle: Duy trì kiểm biên đọc ở từng cấu trúc metadata và gắn tài nguyên parser với lifecycle request; không coi file trên đĩa là dữ liệu đã tin cậy.
    defense: Rà soát đường xuất bản media và quyền thay đổi file; ưu tiên bản sửa đúng nhánh. Đánh giá nhu cầu pseudo-streaming trước khi thay đổi tính năng đang phục vụ người dùng.
    patch_note: Bản sửa 1.26.2 thuộc nhánh ổn định và 1.27.1 thuộc nhánh mainline của đợt công bố; điều đó không xác nhận các nhánh này còn hỗ trợ ở thời điểm triển khai.
    question: Vì sao over-read gây kết thúc worker vẫn chưa đủ để ghi confirmed information disclosure?
    answer: Hành vi đọc vượt biên và việc truyền dữ liệu ra ngoài là hai bước khác nhau; CNA của CVE này chỉ xác nhận hậu quả kết thúc worker.
    unknown: Chưa biết atom/hàm lỗi, đường truyền dữ liệu đọc được hoặc quyền của worker trong một deployment cụ thể.
    maturity: AI_REVIEWED
  - cve: CVE-2026-27784
    summary: Lỗi xử lý MP4 được CNA giới hạn ở NGINX Open Source 32-bit. Đọc hoặc ghi ngoài vùng bộ nhớ có thể kết thúc worker; không được dùng phạm vi của CVE MP4 khác thay điều kiện kiến trúc này.
    architecture: Parser MP4 của bản OSS 32-bit, thuộc xử lý request ở worker. CNA không gán cùng phạm vi này cho mọi sản phẩm Plus hoặc mọi hệ 64-bit.
    normal: Metadata mô tả vị trí và số lượng phần tử của media. Khi ánh xạ chúng sang kích thước buffer trong tiến trình 32-bit, biểu diễn số và giới hạn file phải đồng thời hợp lệ.
    mechanism: CNA công bố over-read hoặc over-write. Điều kiện 32-bit làm việc kiểm biểu diễn kích thước đặc biệt quan trọng về mặt thiết kế; nguồn chưa đủ để gọi integer overflow là root cause đã chứng minh.
    applicability: Chỉ bản NGINX Open Source 32-bit được CNA nêu; phải có module MP4 và directive mp4, cùng đường xử lý tệp qua module. Không suy applicability từ đuôi file.
    impact: CNA nêu đọc/ghi vượt vùng bộ nhớ worker có thể dẫn đến kết thúc worker.
    potential: Code execution và tác động trên 64-bit chưa được xác nhận cho CVE này trong nguồn đã đọc. Không mượn câu possibly code execution của CVE-2026-32647.
    principle: Kiểm phạm vi biểu diễn trước chuyển kiểu và trước tính kích thước; giữ riêng phạm vi CPU/build trong inventory quản lý bản vá.
    defense: Inventory phải ghi kiến trúc binary đang chạy, module được build và package origin. Kiểm soát đầu vào media chỉ bổ sung cho remediation bằng bản sửa.
    patch_note: Đối chiếu bản sửa 1.28.3 hoặc 1.29.7 với nhánh và package phân phối. Không tự kết luận 64-bit không có rủi ro từ các CVE khác cùng module.
    question: Một inventory chỉ có số phiên bản và tên nginx còn thiếu dữ kiện nào để xét phạm vi 27784?
    answer: Kiến trúc 32-bit/64-bit của binary, module MP4 và đường cấu hình dùng module; package provenance còn cần cho quyết định backport.
    unknown: Kiểu số, phép tính, atom và hàm cụ thể liên quan chưa được xác minh độc lập.
    maturity: AI_REVIEWED
  - cve: CVE-2026-32647
    summary: CNA mô tả đọc hoặc ghi ngoài vùng bộ nhớ trong xử lý MP4, có thể kết thúc worker hoặc có khả năng thực thi mã. Phải giữ chữ có thể và không suy quyền thực thi từ việc worker thuộc NGINX.
    architecture: ngx_http_mp4_module trong worker; nguồn CNA bao gồm OSS và Plus, còn version table trong nghiên cứu này chỉ là OSS.
    normal: Request xử lý media dẫn tới đọc metadata, xác định phạm vi dữ liệu rồi tạo output. Kích thước nguồn, kích thước đích và ownership phải phù hợp trên toàn bộ quá trình.
    mechanism: Nguồn chỉ ra buffer over-read hoặc over-write; chưa chỉ rõ đối tượng bị ghi, đường kiểm biên hoặc chi tiết bản vá. Cần phân biệt tính đúng của metadata với tính an toàn của implementation khi xử lý nó.
    applicability: Build có module MP4, cấu hình dùng mp4 và tệp được xử lý bởi module. CNA không nêu giới hạn chỉ 32-bit như CVE-2026-27784.
    impact: CNA mô tả khả năng kết thúc worker do đọc/ghi ngoài vùng bộ nhớ. Đây là hậu quả được công bố, chưa phải sự cố quan sát trong môi trường cụ thể.
    potential: CNA nêu possibly code execution. Giữ ở tác động tiềm năng; chưa có xác nhận thực thi thành công, đặc quyền root hoặc control-plane compromise.
    principle: Kiểm cả biên đọc và biên ghi; một phép copy có độ dài hợp lệ ở nguồn vẫn cần đủ vùng đích. Quyền worker giới hạn phạm vi truy cập nhưng không sửa lỗi parser.
    defense: Quản lý bản vá module media kết hợp phân quyền worker và quy trình tiếp nhận nội dung. Không thay cập nhật bằng giả định rằng tệp từ kho nội bộ luôn hợp lệ.
    patch_note: Cùng ngưỡng sửa 1.28.3/1.29.7 với 27784 không chứng minh hai lỗi có cùng nguyên nhân hoặc phạm vi kiến trúc.
    question: Khi hai CVE cùng module và cùng bản sửa, có được dùng chung kết luận root cause và impact không?
    answer: Không. Release có thể sửa nhiều lỗi độc lập; cần đối chiếu mô tả, applicability và tác động của từng CVE.
    unknown: Chưa xác định cơ chế thực thi mã, privilege context, atom/hàm lỗi hoặc hiệu lực remediation trên binary triển khai.
    maturity: AI_REVIEWED
