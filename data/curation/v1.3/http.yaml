group: http
name: HTTP processing — biến, đường dẫn, filter và subrequest
shared_knowledge: [COMPONENT:REWRITE-ENGINE, MODULE:NGX-HTTP-CHARSET-MODULE, MODULE:NGX-HTTP-SSI-MODULE, COMPONENT:MEMORY-POOL]
knowledge:
  - id: COMPONENT:REWRITE-ENGINE
    name: HTTP rewrite — URI, biến và kích thước biểu diễn
    source: https://nginx.org/en/docs/http/ngx_http_rewrite_module.html
    locator: Introduction; #rewrite; Internal Implementation
    excerpt: change request URI
    source_fact: Rewrite module thay URI, tạo redirect hoặc chọn cấu hình theo điều kiện; directive xử lý theo thứ tự và có thể dẫn đến chọn lại location.
    prerequisites: [COMPONENT:CONNECTION-LIFECYCLE]
    objectives: [Phân biệt URI với đường dẫn filesystem., Giải thích tính nhất quán giữa phép tính độ dài và dữ liệu thực sự được tạo.]
    body: |
      ## Cơ chế và lifecycle

      Rewrite chạy trên state HTTP request, có thể thay URI và dẫn tới tìm location mới. Tài liệu phân biệt dừng bộ directive hiện tại và bắt đầu tìm lại location. Một URI của request, đối số URI, đường dẫn file và văn bản redirect là các biểu diễn khác nhau. Chúng có quy tắc xử lý độ dài và ký tự riêng; không thể dùng độ dài của biểu diễn này thay biểu diễn khác.

      ## Ownership và biến

      Biến, capture và output trung gian phải thuộc đúng trạng thái request tại lúc dùng. Một giá trị có thể được đánh giá khi được tham chiếu; không giả định mọi biến là hằng kể từ parsing. Mô hình review là lấy giá trị, tính dung lượng, tạo output và sử dụng trong cùng context hợp lệ. Nếu dữ liệu thay giữa hai bước, dung lượng tính trước có thể không còn đúng. Đây là invariant thiết kế, không tự khẳng định mọi CVE rewrite có cùng root cause.

      ## Ranh giới và tradeoff

      Sự linh hoạt của rewrite cho phép biểu diễn policy routing gọn, nhưng tăng tương tác giữa location, URI và filesystem. Capture mang dữ liệu, không mang quyền vượt ranh giới document root. Các nhánh lỗi, redirect và internal redirect đều phải giữ giới hạn buffer và trạng thái biến. Kiểm cấu hình giúp nhận diện tính năng cần quản trị; không thay cập nhật implementation khi vendor công bố lỗi memory.

      ## Nguyên tắc phòng vệ

      Review phép tính kích thước và phép ghi cùng nhau; kiểm overflow trước khi cấp phát và kiểm mỗi bước encode. Phân biệt source-confirmed applicability với mô hình lỗi suy luận. Các CVE alias, map và rewrite có phạm vi phiên bản khác nhau dù cùng liên quan chuỗi; không sao chép điều kiện hay fix từ một bài sang bài khác.
    assessment: Một chuỗi có độ dài hợp lệ trước encode có bảo đảm buffer sau encode đủ không?
    answer: Không; cần tính theo biểu diễn đích và bảo đảm giá trị được tính cũng là giá trị được ghi.
  - id: MODULE:NGX-HTTP-CHARSET-MODULE
    name: Charset filter — chuyển mã trên các buffer
    source: https://nginx.org/en/docs/http/ngx_http_charset_module.html
    locator: Introduction; #charset; #source_charset; #override_charset
    excerpt: convert data from one charset to another
    source_fact: Charset module có thể chuyển mã response từ server tới client theo source_charset, charset và mapping; không chỉ thêm nhãn Content-Type.
    prerequisites: [COMPONENT:CONNECTION-LIFECYCLE, COMPONENT:MEMORY-POOL]
    objectives: [Phân biệt đổi nhãn charset với chuyển byte., Giải thích sự cần thiết giữ state khi ký tự nằm qua biên buffer.]
    body: |
      ## Cơ chế và ownership

      Header Content-Type công bố cách hiểu byte; filter chuyển mã có thể tạo tập byte khác. Tài liệu giới hạn các loại charset được hỗ trợ và hướng chuyển đổi. Khi dữ liệu đi qua nhiều buffer, biên callback không nhất thiết là biên một ký tự. Mô hình implementation cần giữ phần chưa hoàn thành trong context còn sống, rồi tạo output tương thích với charset đích.

      ## Invariant và lifecycle

      Diễn giải: bộ đọc chỉ được lấy byte trong input hợp lệ; bộ ghi phải có dung lượng cho biểu diễn đích. State chuyển đổi phải hoàn tất hoặc bị hủy đúng cùng response. Input buffer không được tái dùng khi filter còn tham chiếu; output đã gửi không được âm thầm thay đổi. Buffering off làm thay đổi nhịp chuyển dữ liệu, không bỏ các nghĩa vụ đó.

      ## Tradeoff và phòng vệ

      Chuyển mã tại proxy giúp tương thích client nhưng tốn CPU, buffer và tăng state filter. Chuẩn hóa encoding ở upstream có thể đơn giản vận hành, song không chứng minh parser cũ đã an toàn. Review từ source response đến output sau chuyển đổi; chỉ gán applicability từng CVE khi CNA nêu đúng cấu hình. Không suy từ buffer over-read rằng byte đã đọc nhất thiết đến client.
    assessment: Tại sao một response được chia buffer khác nhau có thể cần giữ state chuyển mã?
    answer: Biên I/O không bảo đảm trùng biên ký tự; phần ký tự chưa hoàn tất cần được xử lý trong một context hợp lệ.
  - id: MODULE:NGX-HTTP-SSI-MODULE
    name: SSI và subrequest — công việc con, output và cleanup
    source: https://nginx.org/en/docs/http/ngx_http_ssi_module.html
    locator: Introduction; #ssi; SSI Commands / include
    excerpt: SSI commands
    source_fact: SSI module xử lý lệnh trong response và có thể đưa nội dung khác vào qua include; việc này khác với gửi response nguyên trạng.
    prerequisites: [COMPONENT:CONNECTION-LIFECYCLE, COMPONENT:MEMORY-POOL]
    objectives: [Phân biệt subrequest với client connection mới., Nêu nghĩa vụ giữ output sống đến khi consumer kết thúc.]
    body: |
      ## Cơ chế bình thường

      SSI là filter có thể tạo công việc bổ sung để lấy nội dung và ghép vào response. Công việc con tham gia lifecycle của request nhưng không đồng nhất với một client connection mới. Một phần output có thể đã sẵn sàng trong khi phần khác còn chờ; mô hình dữ liệu cần biểu diễn thứ tự và điểm hoàn tất rõ ràng.

      ## Ownership và invariant

      Diễn giải thiết kế: main request, subrequest, buffer và thao tác I/O có thể hoàn thành khác thời điểm. Callback hoàn tất phải được ràng buộc với owner còn sống; hủy main request không cho phép callback muộn tiếp tục dùng bộ nhớ cũ. Bộ lọc giữ con trỏ input phải biết khi nào upstream hoặc pool được quyền tái dùng vùng đó. Việc chuyển sang đường AIO còn thêm một mốc hoàn tất ngoài lần gọi hiện tại.

      ## Tradeoff và phòng vệ

      Ghép nội dung tăng khả năng tái sử dụng nhưng tăng số tác vụ và tài nguyên đồng thời. Buffering giảm lệ thuộc tốc độ bên nhận nhưng cần thêm bộ nhớ/đĩa; tắt buffering không loại bỏ lifetime requirement. Review cancellation, timeout và thứ tự cleanup; dùng bản sửa khi advisory chỉ ra UAF. SSI, slice và mirror đều có thể liên hệ subrequest nhưng không được coi cùng implementation hay cùng lỗi.
    assessment: Handler tạo subrequest đã trả về có nghĩa mọi output của nó đã được giải phóng được chưa?
    answer: Chưa; cần biết consumer, buffered output và callback còn chờ trước khi kết luận lifetime đã kết thúc.
articles:
  - cve: CVE-2026-125283
    knowledge: [COMPONENT:REWRITE-ENGINE, COMPONENT:MEMORY-POOL]
    summary: Tương tác alias, try_files và map/capture có thể kết thúc worker do lỗi buffer theo advisory.
    architecture: HTTP filesystem-path construction với alias và try_files; không xác định allocator lỗi.
    normal: Đường dẫn được tính từ giá trị biến hợp lệ và ghi trong dung lượng đã tính cho chính giá trị đó.
    mechanism: Advisory nêu overflow, CNA mô tả segmentation fault ở tổ hợp directive. Sự nhất quán sizing/evaluation là diễn giải, chưa là patch review.
    applicability: try_files và alias với map variable và một số tương tác capture theo CNA; không phải mọi alias đều bị lỗi.
    impact: Worker có thể kết thúc bất ngờ theo CNA.
    potential: Không nâng overflow thành RCE; nguồn CVE này xác nhận termination, không công bố execution.
    principle: Cùng một giá trị phải được dùng cho tính kích thước và tạo đường dẫn.
    defense: Vá bản đang chạy; review quản lý capture và đường dẫn với quyền worker giới hạn.
    patch_note: Fix 1.30.7/1.31.9; không dùng ngưỡng của alias/rewrite 15176.
    question: Buffer overflow có đủ để ghi confirmed RCE ở note này không?
    answer: Không; cần nguồn xác nhận tác động đó, trong khi CNA ở đây chỉ mô tả termination.
    unknown: Phép tính và buffer path cụ thể chưa xác minh độc lập.
    maturity: TECHNICAL_DRAFT
  - cve: CVE-2026-15176
    knowledge: [COMPONENT:REWRITE-ENGINE, COMPONENT:MEMORY-POOL]
    summary: Xây dựng filename trong context alias/rewrite có thể gây heap overflow.
    architecture: HTTP location và filename-variable evaluation; không phải alias traversal được chứng minh.
    normal: Filename phản ánh URI/location hiện tại và được biểu diễn trong buffer đủ dung lượng.
    mechanism: CNA mô tả heap overflow khi filename được tham chiếu trong các context rewrite/logging; chưa xác định bước sizing sai.
    applicability: alias kết hợp rewrite và tham chiếu request_filename trong các directive hoặc log format được CNA nêu; còn điều kiện ngoài kiểm soát tác nhân.
    impact: Heap overflow có thể restart worker theo CNA.
    potential: Code execution là khả năng có điều kiện ASLR; không xác nhận thực thi hoặc quyền root.
    principle: Derived filename phải nhất quán với generation của URI và cấu hình location.
    defense: Cập nhật NGINX; review side effects của đánh giá biến tại nhiều phase, giữ phân quyền filesystem.
    patch_note: Fix 1.30.6/1.31.7; không áp khoảng của try_files/map 125283.
    question: Filename hợp lệ ở phase trước có nhất thiết giữ nguyên sau rewrite không?
    answer: Không; URI/location có thể thay đổi, nên giá trị dẫn xuất và dung lượng phải cùng context.
    unknown: Nhánh script evaluation và allocation cụ thể chưa xác minh.
    maturity: TECHNICAL_DRAFT
  - cve: CVE-2026-9256
    knowledge: [COMPONENT:REWRITE-ENGINE, COMPONENT:MEMORY-POOL]
    summary: Rewrite xử lý capture và biểu diễn redirect/arguments có thể gây heap overflow.
    architecture: Rewrite expression evaluation và tạo biểu diễn URI đầu ra.
    normal: Độ dài output phải tính theo dữ liệu capture và quy tắc encode của context đích.
    mechanism: CNA nêu tương tác capture chồng lấn và replacement context; bài chỉ diễn giải nguy cơ sizing không tương thích, không cung cấp pattern tái hiện.
    applicability: Một số rewrite dùng capture và replacement trong redirect hoặc arguments context theo CNA; không kết luận mọi regex capture bị ảnh hưởng.
    impact: Heap overflow có thể làm worker restart.
    potential: CNA nêu code execution có điều kiện ASLR, chưa xác minh trong deployment.
    principle: Kiểm sizing theo biểu diễn đích, bao gồm độ dài tăng do encode và các phần được tham chiếu.
    defense: Vá implementation, review phép tính buffer với input/output contract thay vì chỉ kiểm cú pháp regex.
    patch_note: Fix 1.30.2/1.31.1, khác hai CVE rewrite/map có bản sửa sau.
    question: Một pattern regex hợp lệ có chứng minh output buffer đủ không?
    answer: Không; cú pháp pattern và tính an toàn của phép tính dung lượng là hai kiểm tra khác nhau.
    unknown: Chi tiết arithmetic và patch correctness chưa được review.
    maturity: TECHNICAL_DRAFT
  - cve: CVE-2026-42945
    knowledge: [COMPONENT:REWRITE-ENGINE, COMPONENT:MEMORY-POOL]
    summary: Tương tác các bước rewrite và capture có thể dẫn đến heap overflow trong tạo chuỗi.
    architecture: Chuỗi directive rewrite và state capture của request.
    normal: Mỗi bước dùng capture của đúng lần đánh giá và dung lượng theo output hiện tại.
    mechanism: CNA nêu thứ tự directive và replacement context liên quan. Diễn giải là sizing và state capture phải nhất quán; chưa xác định dòng mã lỗi.
    applicability: Các tổ hợp rewrite, if hoặc set và capture/replacement được CNA mô tả; không coi mọi rewrite là đủ điều kiện.
    impact: Heap overflow có thể restart worker.
    potential: CNA nêu code execution có điều kiện ASLR; không xác nhận thực thi hoặc quyền root.
    principle: Đánh giá lại biểu thức không được âm thầm thay dữ liệu sau khi đã tính capacity.
    defense: Vá bản đang chạy, review các transition của biến và buffer qua nhiều directive.
    patch_note: Fix 1.30.1/1.31.0; khác lỗi 9256 có ngưỡng sửa sau đó.
    question: Hai lỗi rewrite cùng heap overflow có dùng chung bản sửa nhỏ nhất không?
    answer: Không; phải so entry từng CVE và các nhánh phát hành.
    unknown: Capture state và phép tính gây sai dung lượng chưa được review độc lập.
    maturity: TECHNICAL_DRAFT
  - cve: CVE-2026-42533
    knowledge: [COMPONENT:REWRITE-ENGINE, MODULE:NGX-HTTP-MAP-MODULE, COMPONENT:MEMORY-POOL]
    summary: Đánh giá map/regex và biến trong string expression có thể làm heap overflow.
    architecture: HTTP variable evaluation với map/capture; không suy fault nằm ở thư viện regex.
    normal: Giá trị map được đánh giá khi dùng; capture và output phải được tiêu thụ trong context phù hợp.
    mechanism: CNA nêu thứ tự tham chiếu capture/map hoặc non-cacheable variable. Mô hình phòng vệ là giữ dữ liệu giữa pha sizing và pha tạo output nhất quán.
    applicability: Map dùng regex và string expression với tương tác capture, hoặc non-cacheable variable trong điều kiện nguồn nêu.
    impact: Heap overflow và worker restart được CNA công bố; data-plane scope.
    potential: Code execution được nguồn nêu có điều kiện ASLR; chưa xác minh thực tế.
    principle: Lazy evaluation có side effect lên state cần được tính trong contract của expression.
    defense: Dùng bản sửa; review evaluation order thay vì chỉ xem giá trị cuối của map.
    patch_note: Fix 1.30.4/1.31.3; không coi fix này đủ cho CVE-2026-93479.
    question: Vì sao hai lần đọc biến có thể không tương đương một hằng số?
    answer: Evaluation có thể phụ thuộc context, cacheability và state capture; cần contract rõ.
    unknown: Instruction và allocation gây lỗi chưa review source/patch.
    maturity: TECHNICAL_DRAFT
  - cve: CVE-2026-93479
    knowledge: [COMPONENT:REWRITE-ENGINE, MODULE:NGX-HTTP-MAP-MODULE, COMPONENT:MEMORY-POOL]
    summary: Script evaluation trong root hoặc access-log context có thể gặp heap overflow khi dùng state map/regex.
    architecture: HTTP variable evaluation tại filesystem-root hoặc logging, không chỉ rewrite URI.
    normal: Đánh giá biến cho log và đường dẫn phải tôn trọng lifetime/capacity như các phase xử lý khác.
    mechanism: CNA nêu capture/map ordering và non-cacheable values. Chưa có bằng chứng để tuyên bố đây chỉ là cùng lỗi 42533 chưa sửa.
    applicability: Map regex và root/log format có tương tác capture theo CNA, hoặc non-cacheable variables trong một số điều kiện.
    impact: Heap overflow có thể restart worker; CNA xác định data-plane issue.
    potential: Code execution là khả năng có điều kiện ASLR, chưa được xác minh runtime.
    principle: Các phase muộn như logging vẫn phải giữ invariant bộ nhớ, không được coi là chỉ quan sát vô hại.
    defense: Vá các nhánh bị ảnh hưởng và review expression evaluation xuyên phase.
    patch_note: Advisory có hai khoảng 1.31.2–1.31.6 và 1.30.0–1.30.5; fix 1.31.7/1.30.6. Không nối hai khoảng thành một khoảng suy đoán.
    question: Vì sao logging vẫn có thể thuộc phạm vi memory-safety review?
    answer: Nó có thể đánh giá biến và tạo buffer, nên cũng có ownership, sizing và state transition.
    unknown: Quan hệ code-level với 42533 chưa xác minh; không kết luận duplicate hoặc regression chỉ từ mô tả.
    maturity: TECHNICAL_DRAFT
  - cve: CVE-2026-42934
    knowledge: [MODULE:NGX-HTTP-CHARSET-MODULE, COMPONENT:MEMORY-POOL]
    summary: Charset conversion cùng proxy không buffering có thể gây over-read và lộ bộ nhớ giới hạn hoặc restart.
    architecture: HTTP charset output filter trên response proxy.
    normal: Filter chỉ đọc byte hợp lệ và giữ phần ký tự chưa hoàn tất giữa các buffer của cùng response.
    mechanism: CNA xác nhận heap over-read; ảnh hưởng của biên buffer lên state chuyển mã là giải thích kiến trúc, chưa định vị phép đọc sai.
    applicability: charset, source_charset, charset_map và proxy_pass với buffering off được CNA nêu; có điều kiện ngoài kiểm soát tác nhân.
    impact: Limited memory disclosure hoặc worker restart theo CNA.
    potential: Không suy rò toàn bộ heap hay code execution; loại dữ liệu và mức lộ cụ thể chưa biết.
    principle: Biên I/O không phải biên ký tự; giữ state conversion và giới hạn input đồng thời.
    defense: Dùng bản sửa; review response-filter ownership với các chế độ buffering thực dùng.
    patch_note: Fix 1.30.1/1.31.0; không nhập phạm vi rộng hơn của 48142.
    question: Tắt buffering có loại bỏ nhu cầu buffer hợp lệ ở filter không?
    answer: Không; dữ liệu vẫn đi qua buffer và state conversion, chỉ nhịp nhận/gửi thay đổi.
    unknown: Dữ liệu lộ, vị trí đọc và transition filter cụ thể chưa xác minh.
    maturity: TECHNICAL_DRAFT
  - cve: CVE-2026-48142
    knowledge: [MODULE:NGX-HTTP-CHARSET-MODULE, COMPONENT:MEMORY-POOL]
    summary: Chuyển response từ UTF-8 sang charset khác có thể gây heap over-read trong charset module.
    architecture: Charset output filter trên nội dung phục vụ trực tiếp hoặc proxy.
    normal: Converter chỉ tiêu thụ byte thuộc input hợp lệ và ghi đúng biểu diễn charset đích.
    mechanism: CNA xác nhận over-read; không đủ dữ liệu để khẳng định cùng nhánh lỗi với 42934.
    applicability: Location dùng source_charset UTF-8 và charset đích; có thể áp dụng cho nội dung served hoặc proxied theo CNA.
    impact: Limited disclosure của bộ nhớ hoặc worker restart được CNA nêu.
    potential: Loại dữ liệu lộ và phạm vi confidentiality cụ thể UNKNOWN; không suy RCE từ over-read.
    principle: Kiểm biên trên mọi nhánh decode, kể cả chuỗi chia qua nhiều phần input.
    defense: Cập nhật charset module; review pipeline encode/decode và lifetime buffer.
    patch_note: Fix 1.30.3/1.31.2; không thêm điều kiện proxy_buffering off của 42934 vào CVE này.
    question: Vì sao không được lấy điều kiện của CVE cùng module để thu hẹp applicability?
