[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nvkb"
version = "1.3.0"
description = "Evidence-first, local NGINX vulnerability knowledge library"
requires-python = ">=3.11,<3.15"
dependencies = [
  "linkml==1.12.1", "linkml-runtime>=1.12,<2",
  "pyvulnerabilitylookup==4.5.0", "requests>=2.34.2,<3",
  "typer>=0.16,<1", "rich>=14,<15", "Jinja2>=3.1.6,<4",
  "beautifulsoup4>=4.13,<5", "PyYAML>=6,<7", "jsonschema[format]>=4.26,<5",
  "packaging>=25", "python-debian>=1.0", "rpm-vercmp>=0.1.2"
]

[project.scripts]
nvkb = "nvkb.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: opt-in public source integration"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/nvkb"]
